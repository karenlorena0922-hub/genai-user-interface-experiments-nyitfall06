<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Experiments</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            background: linear-gradient(135deg, #f6e7c1, #d9a441);
            color: #3b2412;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 40px;
            font-size: 42px;
            color: #4a2c14;
            text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.3);
        }

        div {
            position: relative;
        }

        button {
            position: relative;
            padding: 18px 42px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #3b2412;
            background: linear-gradient(135deg, #ffd86b, #f4a261);
            border: 2px solid #7a4e1d;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 
                0 10px 25px rgba(74, 44, 20, 0.35),
                inset 0 0 12px rgba(255, 255, 255, 0.45);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        button::before {
            content: "✦";
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #7a4e1d;
            font-size: 14px;
        }

        button::after {
            content: "🦋";
            position: absolute;
            right: -24px;
            top: -18px;
            font-size: 24px;
            opacity: 0;
            transition: all 0.4s ease;
        }

        button:hover {
            transform: translateY(-5px);
            background: linear-gradient(135deg, #ffe08a, #e76f51);
            box-shadow: 
                0 18px 35px rgba(74, 44, 20, 0.45),
                0 0 25px rgba(255, 216, 107, 0.8);
        }

        button:hover::after {
            right: 16px;
            top: -28px;
            opacity: 1;
        }

        button:active {
            transform: translateY(0) scale(0.97);
        }

        .butterfly {
            position: absolute;
            font-size: 28px;
            opacity: 0.75;
            animation: float 6s infinite ease-in-out;
        }

        .butterfly.one {
            top: 15%;
            left: 18%;
        }

        .butterfly.two {
            bottom: 18%;
            right: 22%;
            animation-delay: 2s;
        }

        .butterfly.three {
            top: 30%;
            right: 15%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-25px) rotate(8deg);
            }
        }
    </style>
</head>

<body>
    <span class="butterfly one">🦋</span>
    <span class="butterfly two">🦋</span>
    <span class="butterfly three">🦋</span>

    <h1>UI Font Experiments</h1>

    <div>
        <button>CLICK ME</button>
    </div>
</body>
</html>
